<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌦️ Weather Dashboard</h1>
        <p class="subtitle">Search live weather by city name</p>

        <!-- Search Section -->
        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">Search</button>
        </div>

        <!-- Loading -->
        <p id="loading" class="loading">Loading...</p>

        <!-- Error -->
        <p id="errorMessage" class="error"></p>

        <!-- Weather Card -->
        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">Delhi</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="weatherDescription">Weather condition</p>

            <div class="weather-info">

                <div class="info-box">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p id="humidity">-- %</p>
                </div>

                <div class="info-box">
                    <span>💨</span>
                    <h3>Wind Speed</h3>
                    <p id="windSpeed">-- km/h</p>
                </div>

                <div class="info-box">
                    <span>🌡️</span>
                    <h3>Feels Like</h3>
                    <p id="feelsLike">--°C</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
